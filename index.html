<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Install ZimPro-Linkup</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZimPro-Linkup">
<meta property="og:title" content="Install ZimPro-Linkup on your phone">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#141a33}
body{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow-x:hidden;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(60% 45% at 8% 5%,rgba(130,170,255,.95) 0,rgba(130,170,255,0) 62%),
    radial-gradient(55% 40% at 96% 14%,rgba(205,150,255,.9) 0,rgba(205,150,255,0) 64%),
    radial-gradient(65% 50% at 92% 97%,rgba(100,232,206,.8) 0,rgba(100,232,206,0) 62%),
    radial-gradient(55% 45% at 3% 93%,rgba(255,170,212,.7) 0,rgba(255,170,212,0) 62%),
    linear-gradient(160deg,#dfe8ff 0%,#efe5ff 55%,#d9f6ec 100%);
  background-attachment:fixed;
}
/* soft glass bubbles in the background (decoration only) */
.bub{position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 38%,rgba(255,255,255,.08) 70%);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 -8px 18px rgba(120,130,255,.15),0 10px 30px rgba(90,100,200,.12)}
.b1{width:120px;height:120px;left:-34px;top:11%}
.b2{width:70px;height:70px;right:8%;top:6%}
.b3{width:150px;height:150px;right:-50px;bottom:12%}
.b4{width:54px;height:54px;left:10%;bottom:6%}

.card{
  position:relative;z-index:1;width:100%;max-width:410px;text-align:center;padding:30px 22px 22px;border-radius:34px;
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.40));
  border:1px solid rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  box-shadow:0 26px 64px rgba(70,80,170,.28),0 4px 14px rgba(70,80,170,.10),inset 0 1.5px 0 rgba(255,255,255,.98),inset 0 -1px 0 rgba(255,255,255,.45);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:rgba(255,255,255,.9)}}

.logo{width:108px;height:108px;margin:0 auto 16px;padding:7px;border-radius:32px;position:relative;
  background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.5));
  border:1px solid rgba(255,255,255,.98);
  box-shadow:0 18px 40px rgba(84,104,255,.40),0 4px 10px rgba(84,104,255,.18),inset 0 2px 0 #fff,inset 0 -3px 8px rgba(120,130,255,.18)}
.logo img{width:100%;height:100%;display:block;border-radius:25px;object-fit:cover}
h1{margin:0 0 6px;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.2px;color:#141a33}
.sub{margin:0 0 18px;font-size:14.5px;line-height:1.55;color:#464e72}

.perks{list-style:none;margin:0 0 18px;padding:0;text-align:left;font-size:14.5px;font-weight:600;color:#2b3157}
.perks li{display:flex;gap:11px;align-items:center;line-height:1.35;padding:11px 13px;margin-bottom:8px;border-radius:16px;
  background:linear-gradient(145deg,rgba(255,255,255,.80),rgba(255,255,255,.48));border:1px solid rgba(255,255,255,.95);
  box-shadow:0 6px 16px rgba(70,80,170,.08),inset 0 1px 0 rgba(255,255,255,.95)}
.ck{flex:0 0 24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;
  background:linear-gradient(135deg,#5468FF,#7B45F0);box-shadow:0 4px 10px rgba(98,92,255,.4)}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:20px;
  color:#fff;font-size:18px;font-weight:800;letter-spacing:.2px;cursor:pointer;text-decoration:none;font-family:inherit;
  background:linear-gradient(135deg,#5468FF 0%,#7B45F0 100%);
  box-shadow:0 16px 32px rgba(98,92,255,.46),0 3px 8px rgba(98,92,255,.28),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -3px 8px rgba(60,30,170,.28)}
.btn::before{content:'';position:absolute;left:0;right:0;top:0;height:52%;border-radius:20px 20px 60% 60%/20px 20px 16px 16px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.04));pointer-events:none}
.btn:active{filter:brightness(.95)}
.btn.ghost{min-height:48px;font-size:15px;font-weight:700;color:#3a40c8;border-radius:16px;
  background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.95);
  box-shadow:0 8px 18px rgba(70,80,170,.12),inset 0 1px 0 #fff}
.btn.ghost::before{display:none}
.btn[disabled]{opacity:.7}
.row{display:flex;gap:10px;margin-top:10px}

.steps{margin:14px 0 0;padding:0;list-style:none;text-align:left;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 13px;border-radius:16px;margin-bottom:8px;font-size:14.5px;line-height:1.45;color:#232a52;
  background:linear-gradient(145deg,rgba(255,255,255,.80),rgba(255,255,255,.46));border:1px solid rgba(255,255,255,.95);
  box-shadow:0 6px 16px rgba(70,80,170,.08),inset 0 1px 0 rgba(255,255,255,.95)}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px;
  background:linear-gradient(135deg,#5468FF,#7B45F0);box-shadow:0 4px 10px rgba(98,92,255,.4)}
.steps svg{display:inline-block;vertical-align:-5px;width:22px;height:22px;margin:0 2px;color:#5468FF}
.hl{animation:hl 1.2s ease 2}
@keyframes hl{50%{box-shadow:0 0 0 4px rgba(84,104,255,.32)}}
.lead{margin:16px 0 0;font-size:13.5px;font-weight:800;color:#2b3157;text-align:left}

.warn,.ok{border-radius:16px;padding:13px 14px;font-size:14.5px;line-height:1.5;text-align:left;margin-bottom:14px;
  box-shadow:0 6px 16px rgba(70,80,170,.08),inset 0 1px 0 rgba(255,255,255,.9)}
.warn{background:linear-gradient(145deg,rgba(255,244,214,.88),rgba(255,236,190,.55));border:1px solid rgba(255,255,255,.95);color:#6b4300}
.ok{background:linear-gradient(145deg,rgba(220,250,236,.9),rgba(196,242,222,.55));border:1px solid rgba(255,255,255,.95);color:#10502d;text-align:center;font-weight:600}
.busy{display:flex;align-items:center;justify-content:center;gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.small{margin-top:14px;font-size:13px;line-height:1.5;color:#59608a}
.small a,.link{color:#3a40c8;font-weight:700;text-decoration:none;background:none;border:0;font:inherit;font-weight:700;cursor:pointer;padding:0}
.chk{margin-top:14px;text-align:left;font-size:12.5px;line-height:1.55;color:#3a4170;padding:12px 14px;border-radius:16px;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.95)}
.chk b{color:#141a33}
.bad{color:#b4232c;font-weight:700}.good{color:#127a45;font-weight:700}
</style>
</head>

  <noscript><a class="btn" href="./">Open ZimPro</a></noscript>
</div>

<script>
(function(){
  /* >>> The address of your app. './' means "the main page in this same folder", the same address people open when you share your link.
         If your app lives at a different address, put the full link here, for example 'https://yourdomain.com/'. */
  var APP_URL = './';

  var ua = navigator.userAgent || '';
  var view = document.getElementById('view'), sub = document.getElementById('sub');
  var deferred = null, installedNow = false, startedAt = Date.now(), waiters = [];
  var DEBUG = /[?&]debug\b/.test(location.search);

  /* ---------- what are we running in? ---------- */
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isMobile = isIOS || isAndroid || /Mobi/i.test(ua);
  var inAppName = '';
  if(/FBAN|FBAV|FB_IAB|FBIOS/.test(ua)) inAppName = 'Facebook';
  else if(/Instagram/.test(ua)) inAppName = 'Instagram';
  else if(/WhatsApp/.test(ua)) inAppName = 'WhatsApp';
  else if(/TikTok|musical_ly|BytedanceWebview/.test(ua)) inAppName = 'TikTok';
  else if(/Snapchat/.test(ua)) inAppName = 'Snapchat';
  else if(/LinkedInApp/.test(ua)) inAppName = 'LinkedIn';
  else if(/Twitter/.test(ua)) inAppName = 'X (Twitter)';
  else if(/Line\//.test(ua)) inAppName = 'LINE';
  else if(/MicroMessenger/.test(ua)) inAppName = 'WeChat';
  else if(isAndroid && /; wv\)/.test(ua)) inAppName = 'this app';
  else if(isIOS && !/Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) inAppName = 'this app';
  var isSamsung = /SamsungBrowser/.test(ua), isFirefox = /Firefox|FxiOS/.test(ua), isOpera = /OPR\/|OPT\/|Opera/.test(ua), isEdge = /EdgA|EdgiOS|Edge\//.test(ua), isUC = /UCBrowser/.test(ua);
  var isIOSSafari = isIOS && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua) && !inAppName;
  var isIOSOther = isIOS && !isIOSSafari && !inAppName;

  function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function flagGet(){ try{ return localStorage.getItem('zpl_installed') === '1'; }catch(e){ return false; } }
  function flagSet(v){ try{ if(v) localStorage.setItem('zpl_installed','1'); else localStorage.removeItem('zpl_installed'); }catch(e){} }

  /* ---------- tiny inline icons (no outside files needed) ---------- */
  var ICON = {
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
    dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    dl:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none;position:relative"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>'
  };
  function B(t){ return '<b>' + t + '</b>'; }

  /* ---------- step lists for each browser ---------- */
  function steps(){
    if(isIOSSafari) return [
      'Tap the ' + B('Share') + ' button ' + ICON.share + ' (bottom of Safari, or top right on iPad).',
      'Scroll down and tap ' + B('Add to Home Screen') + ' ' + ICON.plus,
      'Tap ' + B('Add') + ' (top right). The ZimPro icon is now on your home screen.'];
    if(isIOSOther) return [
      'Tap the ' + B('Share') + ' button ' + ICON.share + ' in your browser.',
      'Tap ' + B('Add to Home Screen') + ' ' + ICON.plus + ', then ' + B('Add') + '.',
      'If you cannot see it, open this page in ' + B('Safari') + ' and repeat the steps.'];
    if(isSamsung) return [
      'Tap the ' + B('menu') + ' ' + ICON.menu + ' at the bottom right.',
      'Tap ' + B('Add page to') + ', then ' + B('Home screen') + '. (Or tap the install icon in the address bar.)',
      'Tap ' + B('Add') + '. The ZimPro icon is now on your home screen.'];
    if(isFirefox) return [
      'Tap the ' + B('menu') + ' ' + ICON.dots + ' (three dots).',
      'Tap ' + B('Install') + ' (or ' + B('Add to Home screen') + ').',
      'Tap ' + B('Add') + '. The ZimPro icon is now on your home screen.'];
    if(isOpera) return [
      'Tap the ' + B('menu') + ' ' + ICON.dots + '.',
      'Tap ' + B('Home screen') + ' (or ' + B('Add to Home screen') + ').',
      'Tap ' + B('Add') + '. The ZimPro icon is now on your home screen.'];
    if(isEdge) return [
      'Tap the ' + B('menu') + ' ' + ICON.dots + ' at the bottom (three dots).',
      'Tap ' + B('Add to phone') + ' (or ' + B('Install') + ').',
      'Tap ' + B('Install') + '. The ZimPro icon is now on your home screen.'];
    if(isAndroid) return [
      'Tap the ' + B('menu') + ' ' + ICON.dots + ' at the top right of your browser.',
      'Tap ' + B('Add to Home screen') + ' (or ' + B('Install app') + ').',
      'If it asks, choose ' + B('Install') + ' or ' + B('Create shortcut') + ', then tap ' + B('Add') + '. The ZimPro icon is now on your home screen.'];
    if(isMobile) return [
      'Open your browser ' + B('menu') + ' ' + ICON.dots + '.',
      'Look for ' + B('Add to Home screen') + ' or ' + B('Install app') + ' and tap it.',
      'Confirm. The ZimPro icon is now on your home screen.'];
    return [
      'In ' + B('Chrome') + ' or ' + B('Edge') + ', click the install icon at the right end of the address bar.',
      'Click ' + B('Install') + '.',
      'Tip: for the phone app, open this same link on your phone.'];
  }
  function stepsHTML(lead){ return '<div class="lead">' + (lead || 'Do these 3 quick steps:') + '</div><ul class="steps" id="steps">' + steps().map(function(s){ return '<li><span>' + s + '</span></li>'; }).join('') + '</ul>'; }

  /* ---------- helpers ---------- */
  function copyLink(btn){
    var url = location.href.split('#')[0].split('?')[0], done = function(){ btn.textContent = 'Link copied \u2713'; setTimeout(function(){ btn.textContent = 'Copy link'; }, 2200); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, fallback); } else fallback();
    function fallback(){ try{ var t = document.createElement('textarea'); t.value = url; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }catch(e){ prompt('Copy this link and open it in your browser:', url); } }
  }
  function chromeIntent(){
    var u = location.href.split('#')[0];
    return 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
  }
  function openLink(){ return '<div class="small">or <a href="' + APP_URL + '">open ZimPro in this browser</a></div>'; }
  function waitForPrompt(ms){            /* resolves with the install prompt if the browser offers it within ms */
    return new Promise(function(res){
      if(deferred) return res(deferred);
      var t = setTimeout(function(){ waiters = waiters.filter(function(w){ return w !== fn; }); res(null); }, ms);
      var fn = function(d){ clearTimeout(t); res(d); }; waiters.push(fn);
    });
  }

  /* ---------- screens ---------- */
  function showInstalled(already){
    sub.textContent = '';
    view.innerHTML = '<div class="ok">' + (already ? 'ZimPro is already installed on this phone.' : 'Done! ZimPro is on your phone. Look for the ZimPro icon on your home screen.') + '</div>' +
      '<a class="btn" href="' + APP_URL + '">Open ZimPro</a>' +
      (already ? '<div class="small">Not on your home screen? <button class="link" id="again" type="button">Show install steps</button></div>' : '');
    var a = document.getElementById('again'); if(a) a.onclick = function(){ flagSet(false); render(); };
  }
  function showInApp(){
    var android = isAndroid;
    sub.textContent = '';
    view.innerHTML = '<div class="warn"><b>You are inside ' + (inAppName === 'this app' ? 'another app' : inAppName) + '.</b> Phones cannot install apps from here. Open this page in your normal browser first, then tap Install.</div>' +
      (android ? '<a class="btn" id="openChrome" href="' + chromeIntent() + '">Open in Chrome</a>' : '') +
      '<ul class="steps" style="margin-top:' + (android ? '14' : '0') + 'px"><li><span>Tap the ' + (isIOS ? B('\u2026') + ' or ' + B('Share') + ' icon' : B('\u22EE') + ' menu') + ' at the top or bottom of this screen.</span></li>' +
      '<li><span>Choose ' + B(isIOS ? 'Open in Safari' : 'Open in Chrome / Open in browser') + '.</span></li>' +
      '<li><span>On the next page tap ' + B('Install App') + '.</span></li></ul>' +
      '<div class="row"><button class="btn ghost" id="copy" type="button">Copy link</button></div>';
    document.getElementById('copy').onclick = function(){ copyLink(this); };
  }
  function showMain(){
    sub.textContent = 'Get the app on your phone. It opens like any other app, straight from your home screen.';
    var expectNative = !isIOS && !isFirefox && !isUC && !isOpera;      /* browsers that can show the one-tap prompt */
    view.innerHTML =
      '<ul class="perks"><li><span class="ck">\u2713</span>One tap from your home screen</li><li><span class="ck">\u2713</span>Free, and it takes about 10 seconds</li></ul>' +
      '<button class="btn" id="go" type="button">' + ICON.dl + '<span id="goT">Install App</span></button>' +
      '<div id="note" class="small" style="margin-top:12px"></div>' +
      '<div id="stepsWrap">' + (expectNative ? '' : stepsHTML()) + '</div>' +
      openLink() +
      (isAndroid ? '<div class="small" style="margin-top:6px"><a id="openChrome" href="' + chromeIntent() + '">Open in Chrome</a> if install does not start</div>' : '') +
      '<div id="dbg"></div>';
    var go = document.getElementById('go'), goT = document.getElementById('goT'), note = document.getElementById('note'), wrap = document.getElementById('stepsWrap');
    function reset(){ go.disabled = false; goT.textContent = 'Install App'; }
    function revealSteps(msg, lead){
      if(!document.getElementById('steps')) wrap.innerHTML = stepsHTML(lead);
      note.textContent = msg || '';
      var st = document.getElementById('steps'); st.classList.remove('hl'); void st.offsetWidth; st.classList.add('hl');
      st.scrollIntoView({ behavior:'smooth', block:'center' });
    }
    function runPrompt(d){
      deferred = null; go.disabled = true; goT.textContent = 'Installing\u2026';
      var p; try{ p = d.prompt(); }catch(e){ reset(); revealSteps('Your phone needs one more step. Follow these quick steps instead.', 'Install from your browser menu:'); return; }
      d.userChoice.then(function(c){
        if(c && c.outcome === 'accepted'){
          flagSet(true);
          /* Chrome finishes the install in the background. If it never reports back, offer the shortcut method. */
          view.innerHTML = '<div class="ok">Installing ZimPro on your phone. This can take a few seconds. Then look for the ZimPro icon on your home screen.</div><a class="btn" href="' + APP_URL + '">Open ZimPro</a><div class="small" id="late"></div>';
          setTimeout(function(){
            if(installedNow) return;
            var l = document.getElementById('late'); if(!l) return;
            l.innerHTML = 'No icon yet? Your phone may have blocked the full install. <button class="link" id="alt" type="button">Add it to your home screen instead</button>';
            document.getElementById('alt').onclick = function(){ flagSet(false); render(); setTimeout(function(){ var g = document.getElementById('go'); if(g){ revealStepsGlobal('This works on every phone, even when the full install is blocked.', 'Add it to your home screen:'); } }, 50); };
          }, 9000);
        } else { reset(); note.textContent = 'No problem. Tap Install App whenever you are ready.'; }
      }, function(){ reset(); revealSteps('Your phone needs one more step. Follow these quick steps instead.', 'Install from your browser menu:'); });
    }
    window.revealStepsGlobal = revealSteps;
    go.onclick = function(){
      if(deferred){ runPrompt(deferred); return; }
      if(isIOS){ revealSteps('Apple phones install from the Share button. Follow the steps below.'); return; }
      if(expectNative && Date.now() - startedAt < 8000){
        /* the browser has not announced install support yet: wait a moment, then start the install automatically */
        go.disabled = true; goT.innerHTML = '<span class="spin"></span>Getting ready\u2026';
        waitForPrompt(4000).then(function(d){ if(d) runPrompt(d); else { reset(); revealSteps('Your browser installs from its menu. Follow the steps below.'); } });
        return;
      }
      revealSteps('Your browser installs from its menu. Follow the steps below.');
    };
    if(DEBUG) selfCheck(document.getElementById('dbg'));
  }

  /* ---------- install self-check (open install.html?debug=1 on a phone that says "cannot be installed") ---------- */
  function selfCheck(box){
    var out = [], link = document.querySelector('link[rel=manifest]'), mUrl = link ? new URL(link.getAttribute('href'), location.href).href : null;
    function line(ok, t){ out.push('<div class="' + (ok ? 'good' : 'bad') + '">' + (ok ? '\u2713 ' : '\u2717 ') + t + '</div>'); box.innerHTML = '<div class="chk"><b>Install self-check</b>' + out.join('') + '</div>'; }
    line(location.protocol === 'https:' || location.hostname === 'localhost', 'Page is served over https');
    line(!!mUrl, 'Page links a manifest');
    line('serviceWorker' in navigator, 'Browser supports service workers');
    if(!mUrl) return;
    fetch(mUrl, { cache:'no-store' }).then(function(r){ line(r.ok, 'manifest.webmanifest loads (HTTP ' + r.status + ')'); return r.json(); }).then(function(m){
      line(!!(m.name || m.short_name), 'Has a name');
      line(!!m.start_url, 'Has start_url (' + m.start_url + ')');
      line(['standalone','fullscreen','minimal-ui'].indexOf(m.display) > -1, 'display is standalone (' + m.display + ')');
      var ic = m.icons || [], has = function(n){ return ic.some(function(i){ return (i.sizes || '').split(' ').indexOf(n + 'x' + n) > -1 || (i.sizes || '').toLowerCase() === 'any'; }); };
      line(has(192), 'Has a 192x192 icon'); line(has(512), 'Has a 512x512 icon (needed for a full install)');
      line(ic.some(function(i){ return /maskable/.test(i.purpose || ''); }), 'Has a maskable icon (recommended)');
      ic.forEach(function(i){ var im = new Image(); im.onload = function(){ line(true, 'Icon loads: ' + i.src); }; im.onerror = function(){ line(false, 'Icon FAILS to load: ' + i.src); }; im.src = new URL(i.src, mUrl).href; });
    }).catch(function(e){ line(false, 'Could not read the manifest: ' + e); });
  }

  function render(){
    if(standalone()){ flagSet(true); sub.textContent = ''; view.innerHTML = '<div class="ok">Opening ZimPro\u2026</div><a class="btn" href="' + APP_URL + '">Open ZimPro</a>'; location.replace(APP_URL); return; }
    if(inAppName){ showInApp(); return; }
    if(flagGet() && !deferred){ showInstalled(true); return; }
    showMain();
  }

  /* ---------- install events ---------- */
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    if(flagGet()){ flagSet(false); }                 /* the browser offers install, so it is not installed any more */
    var w = waiters.slice(); waiters = []; w.forEach(function(f){ f(e); });
    if(!standalone() && !inAppName && !document.getElementById('go')) render();
  });
  window.addEventListener('appinstalled', function(){ installedNow = true; deferred = null; flagSet(true); showInstalled(false); });

  /* a service worker next to the app helps Chrome treat it as installable (same file the app already uses) */
  try{ if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('firebase-messaging-sw.js', { updateViaCache:'none' }).catch(function(){}); }catch(e){}

  /* Chrome can tell us if the app is already on this phone */
  try{ if(navigator.getInstalledRelatedApps){ navigator.getInstalledRelatedApps().then(function(a){ if(a && a.length && !installedNow){ flagSet(true); if(!deferred) render(); } }).catch(function(){}); } }catch(e){}

  render();
})();
</script>
</body>
</html>
